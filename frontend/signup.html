<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新規登録 - English Phrase App</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="auth-view">
      <section class="panel auth-panel">
        <p class="eyebrow">English Phrase App</p>

        <form id="signup-form" class="auth-form" novalidate>
          <h1 class="auth-title">新規登録</h1>
          <label class="field">
            <span class="field-label">メールアドレス</span>
            <input
              id="signup-email"
              class="text-input"
              type="email"
              autocomplete="email"
              required
            />
          </label>
          <label class="field">
            <span class="field-label">パスワード（8文字以上）</span>
            <input
              id="signup-password"
              class="text-input"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </label>
          <p id="signup-error" class="auth-error" aria-live="polite"></p>
          <div class="actions">
            <button id="signup-submit" type="submit">登録</button>
          </div>
          <p class="auth-switch">
            すでにアカウントをお持ちの方は
            <a class="link-button" href="./login.html">ログイン</a>
          </p>
        </form>
      </section>
    </div>
    <script src="./signup.js"></script>
  </body>
</html>
