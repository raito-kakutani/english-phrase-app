<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Phrase App</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="auth-view" class="auth-view" hidden>
      <section class="panel auth-panel">
        <p class="eyebrow">English Phrase App</p>

        <form id="login-form" class="auth-form">
          <h1 class="auth-title">ログイン</h1>
          <label class="field">
            <span class="field-label">メールアドレス</span>
            <input
              id="login-email"
              class="text-input"
              type="email"
              autocomplete="email"
              required
            />
          </label>
          <label class="field">
            <span class="field-label">パスワード</span>
            <input
              id="login-password"
              class="text-input"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <p id="login-error" class="auth-error" aria-live="polite"></p>
          <div class="actions">
            <button id="login-submit" type="submit">ログイン</button>
          </div>
          <p class="auth-switch">
            アカウントをお持ちでない方は
            <button id="show-signup-button" class="link-button" type="button">新規登録</button>
          </p>
        </form>

        <form id="signup-form" class="auth-form" hidden>
          <h1 class="auth-title">新規登録</h1>
          <label class="field">
            <span class="field-label">メールアドレス</span>
            <input
              id="signup-email"
              class="text-input"
              type="email"
              autocomplete="email"
              required
            />
          </label>
          <label class="field">
            <span class="field-label">パスワード（8文字以上）</span>
            <input
              id="signup-password"
              class="text-input"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </label>
          <p id="signup-error" class="auth-error" aria-live="polite"></p>
          <div class="actions">
            <button id="signup-submit" type="submit">登録する</button>
          </div>
          <p class="auth-switch">
            すでにアカウントをお持ちの方は
            <button id="show-login-button" class="link-button" type="button">ログイン</button>
          </p>
        </form>
      </section>
    </div>
    <main id="app-view" class="app" hidden>
      <aside class="sidebar">
        <p class="eyebrow">Menu</p>
        <nav class="menu" aria-label="Screen menu">
          <button class="menu-item is-active" type="button" data-screen-target="phrase-form">
            フレーズ入力
          </button>
          <button class="menu-item" type="button" data-screen-target="today-phrase">
            今日
          </button>
          <button class="menu-item" type="button" data-screen-target="yesterday-phrase">
            昨日
          </button>
          <button class="menu-item menu-item--date" type="button" data-screen-target="date-phrase">
            日付
          </button>
        </nav>
        <button id="logout-button" class="logout-button" type="button">ログアウト</button>
        <div class="calendar">
          <div class="calendar-header">
            <button id="calendar-prev" class="calendar-nav" type="button" aria-label="前月">&#8249;</button>
            <span id="calendar-month-label" class="calendar-month"></span>
            <button id="calendar-next" class="calendar-nav" type="button" aria-label="翌月">&#8250;</button>
          </div>
          <div class="calendar-grid">
            <span class="calendar-dow">日</span>
            <span class="calendar-dow">月</span>
            <span class="calendar-dow">火</span>
            <span class="calendar-dow">水</span>
            <span class="calendar-dow">木</span>
            <span class="calendar-dow">金</span>
            <span class="calendar-dow">土</span>
          </div>
          <div id="calendar-days" class="calendar-grid"></div>
        </div>
      </aside>
      <section
        id="phrase-form"
        class="panel screen is-active"
        data-screen="phrase-form"
      >
        <p class="eyebrow">English Phrase App</p>
        <div class="input-row">
          <label class="field">
            <span class="field-label">日本語</span>
            <textarea
              id="japanese-input"
              class="text-input"
              placeholder="日本語のフレーズを入力"
              rows="8"
            ></textarea>
          </label>
          <label class="field">
            <span class="field-label">英語</span>
            <textarea
              id="english-input"
              class="text-input"
              placeholder="Enter English"
              rows="8"
            ></textarea>
          </label>
        </div>
        <div class="actions">
          <button id="submit-button" type="button">Enter</button>
        </div>
        <p id="result" class="result" aria-live="polite"></p>
      </section>
      <section id="today-phrase" class="panel screen" data-screen="today-phrase" hidden>
        <p class="eyebrow">Today</p>
        <div class="input-row">
          <div class="field">
            <span class="field-label">日本語</span>
            <p id="today-phrase-text" class="phrase-text"></p>
          </div>
          <div id="today-phrase-english-col" class="field">
            <span class="field-label">英語</span>
            <p id="today-phrase-english" class="phrase-text" hidden></p>
          </div>
        </div>
        <div class="phrase-actions">
          <p id="today-phrase-count" class="phrase-count"></p>
          <button id="show-english-button" class="secondary-button" type="button">
            英語表示
          </button>
          <button id="prev-today-phrase-button" class="secondary-button" type="button">
            前へ
          </button>
          <button id="next-today-phrase-button" class="secondary-button" type="button">
            次へ
          </button>
        </div>
      </section>
      <section
        id="yesterday-phrase"
        class="panel screen"
        data-screen="yesterday-phrase"
        hidden
      >
        <p class="eyebrow">Yesterday</p>
        <div class="input-row">
          <div class="field">
            <span class="field-label">日本語</span>
            <p id="yesterday-phrase-text" class="phrase-text"></p>
          </div>
          <div id="yesterday-phrase-english-col" class="field">
            <span class="field-label">英語</span>
            <p id="yesterday-phrase-english" class="phrase-text" hidden></p>
          </div>
        </div>
        <div class="phrase-actions">
          <p id="yesterday-phrase-count" class="phrase-count"></p>
          <button id="show-yesterday-english-button" class="secondary-button" type="button">
            英語表示
          </button>
          <button id="prev-yesterday-phrase-button" class="secondary-button" type="button">
            前へ
          </button>
          <button id="next-yesterday-phrase-button" class="secondary-button" type="button">
            次へ
          </button>
        </div>
      </section>
      <section id="date-phrase" class="panel screen" data-screen="date-phrase" hidden>
        <p id="date-phrase-eyebrow" class="eyebrow">Date</p>
        <div class="input-row">
          <div class="field">
            <span class="field-label">日本語</span>
            <p id="date-phrase-text" class="phrase-text"></p>
          </div>
          <div id="date-phrase-english-col" class="field">
            <span class="field-label">英語</span>
            <p id="date-phrase-english" class="phrase-text" hidden></p>
          </div>
        </div>
        <div class="phrase-actions">
          <p id="date-phrase-count" class="phrase-count"></p>
          <button id="show-date-english-button" class="secondary-button" type="button">
            英語表示
          </button>
          <button id="prev-date-phrase-button" class="secondary-button" type="button">
            前へ
          </button>
          <button id="next-date-phrase-button" class="secondary-button" type="button">
            次へ
          </button>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
