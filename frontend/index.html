<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Phrase App</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <p class="eyebrow">English Phrase App</p>
        <div class="input-row">
          <label class="field">
            <span class="field-label">日本語</span>
            <textarea
              id="japanese-input"
              class="text-input"
              placeholder="&#26085;&#26412;&#35486;&#12434;&#20837;&#21147;"
              rows="8"
            ></textarea>
          </label>
          <label class="field">
            <span class="field-label">英語</span>
            <textarea
              id="english-input"
              class="text-input"
              placeholder="Enter English"
              rows="8"
            ></textarea>
          </label>
        </div>
        <div class="actions">
          <button id="submit-button" type="button">Enter</button>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
